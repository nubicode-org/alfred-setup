name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Tools move their download pages; a weekly run finds out before a learner does.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh materials/*/*.sh materials/*/*/*.sh
      - name: YAML
        run: yamllint --strict -c materials/10-cicd/.yamllint.yaml .
      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml materials/10-cicd/.github/workflows/*.yml
      - name: PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts/windows.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        working-directory: materials/03-programming/python
        run: python3 -m unittest -v
      - name: Go
        working-directory: materials/03-programming/go
        run: go vet ./... && go test ./...
      - name: Node app
        working-directory: materials/08-containers/app
        run: npm test
      - name: Image and compose file
        working-directory: materials/08-containers
        run: docker build -t alfred-hello:dev app && docker compose config --quiet
      - name: Kubernetes manifests
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          "$(go env GOPATH)/bin/kubeconform" -strict -summary materials/09-kubernetes/manifests
      - name: Practice repository script
        run: |
          materials/07-git/make-practice-repo.sh "$RUNNER_TEMP/practice"
          cd "$RUNNER_TEMP/practice" && ! git merge feature/greeting

  install:
    # Run the Linux script for real on fresh systems, twice: the second run must change nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run
        run: ./scripts/linux.sh --dry-run
      - name: Install
        run: ./scripts/linux.sh --yes --no-docker --no-vscode
      - name: Verify
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          ./scripts/verify.sh --offline | tee verify.txt || true
          # In a container there is no Docker, VS Code or Git identity, so those may fail; nothing else may.
          ! grep -E ' FAIL ' verify.txt | grep -vE '^ +(code|docker|git identity) '
      - name: Second run changes nothing
        run: |
          ./scripts/linux.sh --yes --no-docker --no-vscode | tee second.txt
          ! grep -E '^ +(done|\$) ' second.txt
