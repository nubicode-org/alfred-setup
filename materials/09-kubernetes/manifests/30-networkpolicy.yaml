# Deny all incoming traffic to pods in the namespace, then allow only what is needed (Module 3).
# A cluster whose network plugin does not support NetworkPolicy accepts these and ignores them, so
# test a policy before trusting it (the README shows how).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: alfred
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-hello
  namespace: alfred
spec:
  podSelector:
    matchLabels:
      app: hello
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
